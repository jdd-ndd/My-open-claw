<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My OpenClaw - New Brutalism Cover Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0a0c10; font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { padding: 28px; }
    .title { color: #f3f4f6; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .note { color: #9ca3af; font-size: 13px; margin-bottom: 18px; }
    .slide { position: relative; width: min(100%, 1440px); aspect-ratio: 16 / 9; margin: 0 auto; overflow: hidden; border-radius: 20px; background: #f5f3ed; box-shadow: 0 24px 60px rgba(0,0,0,0.35); color: #101316; }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(16,19,22,.08) 1px, transparent 1px), linear-gradient(to bottom, rgba(16,19,22,.08) 1px, transparent 1px); background-size: 54px 54px; opacity: .55; }
    .frame { position: absolute; inset: 52px; border: 2px solid rgba(16,19,22,.9); }
    .sticker { position: absolute; left: 86px; top: 78px; padding: 10px 14px; background: #111; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .chip { position: absolute; right: 86px; top: 82px; width: 230px; height: 230px; border-radius: 50%; border: 18px solid #ff5a3c; }
    .chip::after { content: ""; position: absolute; inset: 44px; border-radius: 50%; background: #111; }
    .bar1 { position: absolute; left: 92px; top: 242px; width: 620px; height: 14px; background: #111; }
    .bar2 { position: absolute; right: 92px; bottom: 136px; width: 520px; height: 14px; background: #ff5a3c; }
    .bar3 { position: absolute; left: 92px; bottom: 92px; width: 420px; height: 14px; background: #111; opacity: .82; }
    h1 { position: absolute; left: 92px; top: 148px; margin: 0; font-size: 96px; line-height: .92; font-weight: 900; letter-spacing: -0.05em; text-transform: uppercase; max-width: 700px; }
    .sub { position: absolute; left: 96px; top: 382px; max-width: 620px; font-size: 24px; line-height: 1.5; color: #2a2f36; }
    .meta { position: absolute; left: 96px; bottom: 88px; font-size: 15px; line-height: 1.9; font-weight: 700; letter-spacing: .02em; color: #444b55; }
    .num { position: absolute; right: 82px; bottom: 82px; font-size: 128px; line-height: 1; font-weight: 900; color: rgba(16,19,22,.08); }
  </style>
</head>
<body>
  <div class="title">My OpenClaw - 新粗野主义封面预览</div>
  <div class="note">这个版本保留粗野主义的直接感，但比传统 brutalism 更克制、更现代，适合项目答辩。</div>
  <section class="slide">
    <div class="grid"></div>
    <div class="frame"></div>
    <div class="sticker">NEW BRUTALISM</div>
    <div class="chip"></div>
    <div class="bar1"></div>
    <div class="bar2"></div>
    <div class="bar3"></div>
    <h1>My<br/>OpenClaw</h1>
    <div class="sub">本地优先、双端协作、结构清晰的 AI Agent 项目答辩封面，强调模块边界、功能完成度与工程感。</div>
    <div class="meta">LOCAL-FIRST / WEB + TUI / AGENT SYSTEM / DEFENSE</div>
    <div class="num">01</div>
  </section>
</body>
</html>
