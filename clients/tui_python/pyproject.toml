[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myopenclaw-tui-python"
version = "1.0.0"
description = "Python/Textual TUI client for MyOpenClaw Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "textual>=0.70.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
myopenclaw-tui = "tui_python.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
