# ── Agent 默认配置 ──
# 文档参考：docs/05-Agent运行时模块.md §7
#
# 配置优先级：环境变量 > 本文件 > 内置默认值
# 环境变量语法：${VAR_NAME}（如 ${DEEPSEEK_API_KEY}）

agents:
  # 默认 Agent：使用 DeepSeek V4 Pro 模型
  - id: default
    name: MyOpenClaw 默认助手
    description: 通用任务处理 Agent
    enabled: true
    # 路由通道配置(决定该 Agent 处理哪些 channel 的消息)
    # 顺序即优先级,数字越小越优先
    channels:
      - channelId: tui
        userIds: ['*']
      - channelId: webchat
        userIds: ['*']
      - channelId: feishu
        userIds: ['*']
      - channelId: qqbot
        userIds: ['*']
      - channelId: wechat
        userIds: ['*']
    llm:
      # 提供商标识（openai / claude / deepseek / local）
      provider: deepseek
      # 模型名称（V4 pro：开启思考模式，适合复杂任务）
      model: deepseek-v4-pro
      # API Key，支持 ${VAR_NAME} 环境变量引用
      apiKey: sk-be05691d889e4a1ca5f60ac915c55e27
      # 自定义 API 地址（留空则使用官方默认地址）
      baseUrl: "https://api.deepseek.com"
      # 适配器显示名称
      displayName: DeepSeek V4 Pro
      # 上下文窗口大小（token 数）
      contextWindow: 128000
      # 请求超时（毫秒）
      timeoutMs: 60000
      # 失败时最大重试次数
      maxRetries: 2
      # 默认生成参数
      options:
        temperature: 0.7
        topP: 1.0
        maxTokens: 8192
      # DeepSeek 专有参数
      deepseek:
        # 思考模式：enabled | disabled
        thinking:
          type: enabled
        # 推理强度：low | medium | high | xhigh | max
        reasoningEffort: high
        # 响应格式：text | json_object
        responseFormat:
          type: text
        # 业务侧用户 ID（用于安全 / KVCache / 调度隔离）
        userId: ${DEEPSEEK_USER_ID}
        # 流式选项
        streamOptions:
          includeUsage: true
    # Lobster 循环配置
    loop:
      # 最大迭代轮数（防无限循环）
      maxIterations: 10
      # 单步最大 ReAct 步骤数
      maxReActSteps: 10
    # 启用的工具列表
    tools:
      enabled:
        - fs
        - exec
        - http
        - browser
        - memory_search
      disabled: []
    # 记忆模块配置
    memory:
      sessionTTL: 3600
      vectorTopK: 5
    # 安全策略
    security:
      allowedPaths:
        - ${HOME}
      blockedCommands:
        - "rm -rf /"
        - "DROP TABLE"
        - "shutdown -h now"
        - "sudo"
      requireConfirmation:
        - fs/delete
        - exec/shell

  # 代码审查 Agent：使用 Claude Sonnet 高质量推理
  - id: code-reviewer
    name: 代码审查专家
    description: 基于 Claude 的代码审查 Agent
    enabled: false
    llm:
      provider: claude
      model: claude-3-5-sonnet-20241022
      apiKey: ${ANTHROPIC_API_KEY}
      contextWindow: 200000
      options:
        temperature: 0.3
        maxTokens: 8192
    loop:
      maxIterations: 8
    tools:
      enabled:
        - fs/read_file
        - exec/shell
        - http

  # 本地隐私助手：使用 Ollama 本地模型
  - id: local-assistant
    name: 本地隐私助手
    description: 完全本地运行，数据不出本机
    enabled: false
    llm:
      provider: local
      model: qwen2.5:7b
      baseUrl: http://localhost:11434/v1
      supportsToolCalls: false
      options:
        temperature: 0.6
        maxTokens: 4096
    loop:
      maxIterations: 6

# 兼容旧配置（保留 default.model 等键以便过渡）
default:
  model: deepseek-v4-pro
  maxTokens: 8192
  temperature: 0.7
  maxReActSteps: 10
  allowedTools:
    - fs
    - exec
    - http
    - browser
    - memory_search